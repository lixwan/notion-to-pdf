<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion → PDF 转换器 Pro V4 Interactive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --text: #2f2d2a;
  --text-2: #787774;
  --bg: #ffffff;
  --bg-2: #f9f8f6;
  --bg-3: #f3f2ef;
  --border: #e8e7e4;
  --callout: #f1f1ef;
  --code-bg: #f6f6f4;
  --link: #0369a1;
  --red: #c7254e;
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --doc-font-size: 16px;
  --doc-font-family: 'Noto Serif SC', Georgia, serif;
  --doc-line-height: 1.8;
  --doc-letter-spacing: 0em;
  --doc-paragraph-gap: 0.8em;
  --page-width: 840px;
  --page-padding-x: 80px;
  --page-padding-top: 64px;
  --page-padding-bottom: 100px;
  --editor-width: 42%;
  --toc-width: 240px;
  --menu-width: 248px;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-3);
  color: var(--text);
  display: flex;
  flex-direction: column;
}
.toolbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 16px; min-height: 64px;
  background: var(--bg); box-shadow: var(--shadow-sm);
  flex-shrink: 0; user-select: none; z-index: 20; flex-wrap: wrap;
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--radius); border: none;
  background: transparent; color: var(--text-2);
  font-size: 18px; cursor: pointer; transition: all 0.2s ease;
}
.icon-btn:hover { background: var(--bg-2); color: var(--text); }
.logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
.logo-box {
  width: 28px; height: 28px; background: var(--text); border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 800;
}
.logo-arrow { color: var(--text-2); font-weight: 400; margin: 0 2px; }
.sep { flex: 1; }
.toolbar-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; }
.control-group {
  display: flex; align-items: center;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; min-height: 36px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}
.control-group > * { border-right: 1px solid var(--border); }
.control-group > *:last-child { border-right: none; }
.toolbar-select {
  height: 100%; border: none; background: transparent;
  padding: 0 10px 0 14px; font-size: 13px; color: var(--text);
  font-family: inherit; cursor: pointer; outline: none;
}
.font-btn {
  width: 36px; height: 100%; border: none; background: transparent;
  font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.font-btn:hover { background: var(--bg-2); color: var(--text); }
.font-val {
  min-width: 46px; text-align: center; font-size: 13px; font-weight: 500;
  color: var(--text); background: var(--bg-2);
  display: inline-flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px;
}
.color-picker {
  display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); padding: 0 12px;
}
.color-picker input[type="color"] {
  width: 22px; height: 22px; padding: 0; border: none; border-radius: 4px; cursor: pointer; background: none;
}
.color-picker input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.color-picker input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,0.1); border-radius: 4px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; height: 36px;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg);
  font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02); transition: all .15s ease;
}
.btn:hover { background: var(--bg-2); border-color: #d4d3d0; }
.btn:active { background: var(--bg-3); }
.btn-primary { background: var(--text); color: #fff; border-color: var(--text); }
.btn-primary:hover { background: #4a4845; border-color: #4a4845; }
.btn-secondary.active, .icon-btn.active { background: var(--bg-2); color: var(--text); }

.main { display: flex; flex: 1; overflow: hidden; background: var(--border); position: relative; }
.pane-editor {
  width: var(--editor-width); min-width: 320px; max-width: 78%;
  display: flex; flex-direction: column; background: var(--bg-2); position: relative; transition: min-width 0.2s;
}
.pane-editor.collapsed { width: 0 !important; min-width: 0; border-right: none; overflow: hidden; }
.pane-editor.drag-over { background: #e8f0fe; }
.pane-editor.drag-over::after {
  content: "📂 释放鼠标，解析 ZIP 压缩包";
  position: absolute; inset: 12px;
  background: rgba(255, 255, 255, 0.88); border: 3px dashed var(--link); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: var(--link); z-index: 100; pointer-events: none;
}
.resizer {
  width: 10px; background: linear-gradient(to right, transparent 0, transparent 4px, #d8d6d1 4px, #d8d6d1 6px, transparent 6px, transparent 100%);
  cursor: col-resize; flex-shrink: 0; position: relative;
}
.resizer:hover::after, .resizer.dragging::after {
  content: ''; position: absolute; inset: 0; background: rgba(3,105,161,0.08);
}
.pane-label {
  padding: 12px 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--text-2);
  border-bottom: 1px solid var(--border); background: var(--bg-2); flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.CodeMirror {
  flex: 1; height: auto; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7;
  color: #44413c; background: transparent; padding: 12px;
}
.CodeMirror-lines { padding: 10px 0; }
.CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like { padding: 0 10px; }
.char-counter { position: absolute; bottom: 14px; right: 18px; font-size: 11px; color: var(--text-2); pointer-events: none; z-index: 10; opacity: 0.8; }

.toc-sidebar {
  width: var(--toc-width); min-width: 200px; border-right: 1px solid var(--border); background: #fcfbfa; overflow-y: auto; flex-shrink: 0;
  padding: 18px 14px 22px; transition: width .2s ease, padding .2s ease, border-color .2s ease;
}
.toc-sidebar.hidden { width: 0; padding-left: 0; padding-right: 0; border-right-color: transparent; overflow: hidden; }
.pane-preview { flex: 1; background: #fff; overflow: hidden; position: relative; display: flex; min-width: 0; }
.toc-title { font-size: 11px; letter-spacing: .08em; font-weight: 700; color: var(--text-2); margin-bottom: 12px; }
.toc-list { display: flex; flex-direction: column; gap: 4px; }
.toc-item {
  display: block; width: 100%; text-align: left; border: none; background: transparent; color: var(--text-2);
  padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; line-height: 1.45;
}
.toc-item:hover, .toc-item.active { background: var(--bg-2); color: var(--text); }
.toc-item.level-2 { padding-left: 20px; }
.toc-item.level-3 { padding-left: 30px; font-size: 12.5px; }
.preview-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
.preview-page { max-width: var(--page-width); margin: 0 auto; padding: var(--page-padding-top) var(--page-padding-x) var(--page-padding-bottom); }
.preview-scroll::-webkit-scrollbar, .toc-sidebar::-webkit-scrollbar { width: 8px; }
.preview-scroll::-webkit-scrollbar-track, .toc-sidebar::-webkit-scrollbar-track { background: transparent; }
.preview-scroll::-webkit-scrollbar-thumb, .toc-sidebar::-webkit-scrollbar-thumb { background: #dcdad5; border-radius: 4px; border: 2px solid #fff; }

.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 55vh; gap: 18px; color: var(--text-2); text-align: center;
}
.empty-icon { font-size: 3.2em; opacity: .25; }
.empty-text { font-size: 16px; font-weight: 500; color: var(--text); }
.empty-steps {
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  background: var(--bg-2); border-radius: var(--radius-lg); padding: 22px 28px;
  font-size: 13.5px; color: var(--text-2); line-height: 1.6; border: 1px solid var(--border);
}
.empty-steps b { color: var(--text); }

.doc {
  font-family: var(--doc-font-family); font-size: var(--doc-font-size); line-height: var(--doc-line-height);
  color: var(--text); word-break: break-word; letter-spacing: var(--doc-letter-spacing); transition: font-size 0.2s;
}
.doc h1 { font-size: 1.8em; font-weight: 700; line-height: 1.25; margin: 1.5em 0 0.7em; padding-bottom: 0.35em; border-bottom: 2px solid var(--text); scroll-margin-top: 24px; }
.doc h1.doc-main-title { font-size: 2.4em; text-align: left; border-bottom: none; margin: 0 0 0.8em 0; padding-bottom: 0; }
.doc h2 { font-size: 1.5em; font-weight: 600; line-height: 1.3; margin: 2em 0 0.5em; scroll-margin-top: 24px; }
.doc h3 { font-size: 1.2em; font-weight: 600; margin: 1.6em 0 0.4em; scroll-margin-top: 24px; }
.doc p { margin: 0 0 var(--doc-paragraph-gap); }
.doc p:last-child { margin-bottom: 0; }
.doc ul, .doc ol { padding-left: 1.5em; margin: 0.2em 0 var(--doc-paragraph-gap); }
.doc li { margin: 0.25em 0; }
.doc code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background: var(--code-bg); color: var(--red); padding: 0.15em 0.4em; border-radius: 4px; border: 1px solid rgba(0,0,0,.06); }
.doc pre {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); margin: 1.2em 0; position: relative;
  white-space: pre-wrap !important; word-break: break-all; overflow-wrap: break-word;
}
.doc pre code {
  background: none; color: inherit; border: none; border-radius: 0; display: block; padding: 18px 20px; line-height: 1.65;
  white-space: pre-wrap !important; word-break: break-all; overflow-wrap: break-word; overflow-x: visible;
}
.code-lang {
  position: absolute; top: 0; right: 0; padding: 4px 10px; background: var(--border); color: #777;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; border-bottom-left-radius: var(--radius);
}
.doc .callout {
  display: flex; gap: 14px; background: var(--callout); border-radius: var(--radius-lg); padding: 18px 22px; margin: 1.2em 0;
  break-inside: auto; page-break-inside: auto; transition: all 0.2s ease;
}
.doc.callout-outline-mode .callout { background: transparent !important; border: 1px solid var(--border); }
.callout-icon { font-size: 1.3em; flex-shrink: 0; width: 28px; text-align: center; line-height: 1.4; }
.callout-body { flex: 1; min-width: 0; font-size: 0.95em; }
.callout-body > *:first-child { margin-top: 0; }
.callout-body > *:last-child { margin-bottom: 0; }
.doc blockquote { border-left: 3px solid #d4d3d0; padding: 2px 0 2px 18px; margin: 1em 0; color: var(--text-2); }
.doc table { border-collapse: collapse; width: 100%; margin: 1.4em 0; font-size: 0.9em; font-family: inherit; table-layout: fixed; }
.doc th, .doc td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; word-wrap: break-word; word-break: break-word; white-space: normal; }
.doc th { background: var(--bg-2); font-weight: 600; color: var(--text); }
.doc tr:nth-child(even) td { background: #fafaf8; }
.doc hr { border: none; border-top: 1px solid var(--border); margin: 2.2em 0; }
.doc a { color: var(--link); text-decoration: none; border-bottom: 1px solid rgba(3,105,161,0.2); transition: border-color 0.15s; }
.doc a:hover { border-bottom-color: var(--link); }
.doc img { max-width: 100%; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.katex-display { margin: 1em 0; overflow-x: auto; overflow-y: hidden; padding: 0.5em 0; }
.hidden { display: none !important; }

/* ======== 图片交互控制与排版样式 ======== */
.doc .img-container { width: 100%; margin: 1.2em 0; }
.doc .img-container-left { text-align: left; }
.doc .img-container-center { text-align: center; }
.doc .img-container-right { text-align: right; }

.doc .img-wrapper { position: relative; display: inline-block; max-width: 100%; }
.doc .img-wrapper img { margin: 0 !important; display: block; max-width: 100%; width: auto; }

.img-toolbar {
  position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  display: flex; gap: 4px; padding: 4px; opacity: 0; transition: opacity 0.2s;
  box-shadow: var(--shadow); z-index: 10;
}
.doc .img-wrapper:hover .img-toolbar { opacity: 1; }
.img-toolbar button {
  background: transparent; border: none; cursor: pointer; padding: 4px;
  border-radius: 4px; display: flex; align-items: center; justify-content: center;
  color: var(--text-2); transition: all 0.2s;
}
.img-toolbar button:hover { background: var(--bg-3); color: var(--text); }
.img-toolbar svg { width: 16px; height: 16px; }

.resize-handle {
  position: absolute; width: 10px; height: 10px; background: #fff; border: 1.5px solid var(--link);
  border-radius: 50%; opacity: 0; transition: opacity 0.2s; z-index: 10;
}
.doc .img-wrapper:hover .resize-handle, .resize-handle.active { opacity: 1; }
.resize-handle.top-left { top: -5px; left: -5px; cursor: nwse-resize; }
.resize-handle.top-right { top: -5px; right: -5px; cursor: nesw-resize; }
.resize-handle.bottom-left { bottom: -5px; left: -5px; cursor: nesw-resize; }
.resize-handle.bottom-right { bottom: -5px; right: -5px; cursor: nwse-resize; }

.more-menu-wrap { position: relative; }
.more-menu-btn { font-size: 20px; line-height: 1; }
.more-menu {
  position: absolute; right: 0; top: calc(100% + 10px); width: var(--menu-width); background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 10px; z-index: 30;
}
.more-menu.hidden { display: none; }
.menu-section + .menu-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.menu-label { font-size: 11px; letter-spacing: .08em; color: var(--text-2); font-weight: 700; margin-bottom: 8px; }
.menu-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.menu-row:last-child { margin-bottom: 0; }
.menu-row .row-title { font-size: 13px; color: var(--text); }
.compact-group { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; height: 34px; }
.compact-group > * { border-right: 1px solid var(--border); }
.compact-group > *:last-child { border-right: none; }
.compact-val { min-width: 58px; height: 100%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; background: var(--bg-2); color: var(--text); }
.toggle-btn {
  width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text);
  font-size: 13px; cursor: pointer; text-align: left; padding: 0 12px;
}
.toggle-btn.active { background: var(--bg-2); }

@media (max-width: 1180px) {
  .preview-page { padding-left: 42px; padding-right: 42px; }
}

@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  .toolbar, .pane-editor, .resizer, .toc-sidebar { display: none !important; }
  .main { background: #fff; gap: 0; display: block; border: none; }
  .pane-preview, .preview-scroll { overflow: visible; width: 100%; background: #fff; display: block; }
  .preview-page { max-width: 100%; padding: 0; margin: 0; }
  .doc .callout { background: var(--callout) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .doc.callout-outline-mode .callout { background: transparent !important; border: 1px solid var(--border) !important; }
  .doc pre { background: var(--bg-2) !important; border-color: var(--border) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; break-inside: avoid; white-space: pre-wrap !important; word-break: break-all !important; overflow-wrap: break-word !important; }
  .doc pre code { white-space: pre-wrap !important; word-break: break-all !important; overflow-wrap: break-word !important; }
  .doc table { table-layout: fixed !important; width: 100% !important; }
  .doc th, .doc td { word-wrap: break-word !important; word-break: break-word !important; }
  .doc h1, .doc h2, .doc h3 { break-after: avoid; }
  .doc img { max-height: 800px; object-fit: contain; }
  .img-toolbar, .resize-handle { display: none !important; }
}
</style>
<style id="dynamicPageStyle">
@page { size: A4; margin: 2cm 2.2cm; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="btnToggleToc" class="icon-btn active" title="显示/隐藏目录侧栏">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
  </button>
  <button id="btnToggleSidebar" class="icon-btn active" title="显示/隐藏源码编辑区">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
  </button>
  <div class="logo">
    <div class="logo-box">N</div>
    Notion <span class="logo-arrow">→</span> PDF Pro
  </div>
  <div class="sep"></div>
  <div class="toolbar-controls">
    <div class="control-group">
      <select id="fontSelect" class="toolbar-select" title="全局阅读字体">
        <option value="'Noto Serif SC', Georgia, serif">Noto Serif</option>
        <option value="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Tahoma, Arial, 'Microsoft YaHei', sans-serif">Apple 苹方</option>
        <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
        <option value="'LXGW WenKai Lite', serif">霞鹜文楷</option>
      </select>
    </div>
    <div class="control-group">
      <button class="font-btn" id="btnFontMinus" title="缩小字号">A-</button>
      <div class="font-val" id="fontSizeVal">16px</div>
      <button class="font-btn" id="btnFontPlus" title="放大字号">A+</button>
    </div>
    <button class="btn" id="btnClear">清空</button>
    <label class="btn btn-primary" style="margin:0; cursor:pointer;">
      📁 导入
      <input type="file" id="fileInput" accept=".zip,.md" style="display: none;">
    </label>
    <button class="btn btn-primary" id="btnPrint">🖨&nbsp; 导出 PDF</button>
    <div class="more-menu-wrap">
      <button id="btnMoreMenu" class="icon-btn more-menu-btn" title="更多选项">⋯</button>
      <div class="more-menu hidden" id="moreMenu">
        <div class="menu-section">

<script>
let globalImageMap = {};
let renderTimer;
let currentFontSize = 16;
let currentLineHeight = 1.8;
let currentLetterSpacing = 0;
let currentParagraphGap = 0.8;
const enableScrollSync = false;
let syncLock = false;
let syncReleaseTimer = null;

const pagePresets = {
  A4: { page: 'A4', width: '840px' },
  Letter: { page: 'Letter', width: '816px' },
  A3: { page: 'A3', width: '1120px' }
};
const marginPresets = {
  compact: { css: '1.3cm 1.5cm', screenX: '56px', screenTop: '44px', screenBottom: '72px' },
  standard: { css: '2cm 2.2cm', screenX: '80px', screenTop: '64px', screenBottom: '100px' },
  loose: { css: '2.6cm 2.8cm', screenX: '104px', screenTop: '78px', screenBottom: '118px' }
};

const paneEditor = document.getElementById('paneEditor');
const panePreview = document.getElementById('panePreview');
const tocSidebar = document.getElementById('tocSidebar');
const tocList = document.getElementById('tocList');
const editorTitle = document.getElementById('editorTitle');
const docEl = document.getElementById('doc');

const cmEditor = CodeMirror.fromTextArea(document.getElementById('md-input'), {
  mode: 'markdown',
  lineWrapping: true,
  theme: 'default'
});

function startsWithEmoji(str) {
  if (!str) return false;
  const match = str.match(/^([^\w\s\x00-\x7F]+|\p{Extended_Pictographic})/u);
  return match !== null;
}
function getFirstEmojiLen(str) {
  const match = str.match(/^([^\w\s\x00-\x7F]+|\p{Extended_Pictographic})\s*/u);
  return match ? match[0].length : 0;
}
function slugify(text) {
  return (text || '').toLowerCase().trim().replace(/[\s\W-]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
}
function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function unindent(str) {
  const lines = str.split('\n');
  let minIndent = null;
  for (let line of lines) {
    if (line.trim().length === 0) continue;
    const match = line.match(/^\s*/); 
    const indent = match ? match[0].length : 0;
    if (minIndent === null || indent < minIndent) {
      minIndent = indent;
    }
  }
  if (minIndent !== null && minIndent > 0) {
    return lines.map(line => line.length >= minIndent ? line.substring(minIndent) : line.trimStart()).join('\n');
  }
  return str;
}

marked.use({ gfm: true, breaks: false });
marked.use({
  renderer: {
    code(code, infostring) {
      const lang = (infostring || '').toLowerCase().match(/\S*/)[0];
      let highlighted = code;
      if (lang && hljs.getLanguage(lang)) {
        try { highlighted = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value; }
        catch (e) { highlighted = escapeHtml(code); }
      } else {
        try { highlighted = hljs.highlightAuto(code).value; }
        catch (e) { highlighted = escapeHtml(code); }
      }
      const label = lang ? `<span class="code-lang">${lang}</span>` : '';
      return `<pre>${label}<code class="hljs ${lang}">${highlighted}</code></pre>\n`;
    }
  }
});

function assignHeadingIds() {
  const headings = [...docEl.querySelectorAll('h1:not(.doc-main-title), h2, h3')];
  const counter = new Map();
  headings.forEach((heading, index) => {
    const base = slugify(heading.textContent.trim()) || `section-${index + 1}`;
    const seen = counter.get(base) || 0;
    counter.set(base, seen + 1);
    heading.id = seen ? `${base}-${seen + 1}` : base;
    heading.dataset.tocLevel = heading.tagName[1];
  });
}

function processMarkdown(src) {
  let processed = src.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, url) => {
    try {
      const decoded = decodeURIComponent(url);
      const baseName = decoded.split('/').pop();
      if (globalImageMap[decoded]) return `![${alt}](${globalImageMap[decoded]})`;
      if (globalImageMap[baseName]) return `![${alt}](${globalImageMap[baseName]})`;
    } catch(e) {}
    return match;
  });

  processed = processed.replace(/<img([^>]+)src=["']([^"']+)["']([^>]*)>/gi, (match, before, url, after) => {
    try {
      const decoded = decodeURIComponent(url);
      const baseName = decoded.split('/').pop();
      if (globalImageMap[decoded]) return `<img${before}src="${globalImageMap[decoded]}"${after}>`;
      if (globalImageMap[baseName]) return `<img${before}src="${globalImageMap[baseName]}"${after}>`;
    } catch(e) {}
    return match;
  });

  // 【核心修复】：使用毫无 Markdown 语义的全英文字母占位符，避免被 Marked.js 解析掉下划线
  const mathMap = {};
  let mathCounter = 0;
  const getMathPlaceholder = () => `QXMATHPLACEHOLDER${mathCounter++}XQ`;

  processed = processed.replace(/\$\$([\s\S]+?)\$\$/g, (m) => {
    const p = getMathPlaceholder();
    mathMap[p] = m;
    return p;
  });
  processed = processed.replace(/(?<!\\)\$((?:\\.|[^$\n])+?)(?<!\\)\$/g, (m) => {
    const p = getMathPlaceholder();
    mathMap[p] = m;
    return p;
  });

  const asideMap = {};
  let asideCounter = 0;
  let hasAside = true;

  while (hasAside) {
    hasAside = false;
    // 【核心修复】：捕获前导缩进空格，保留缩进防止中断列表
    processed = processed.replace(/([ \t]*)<aside[^>]*>((?:(?!<aside\b)[\s\S])*?)<\/aside>/gi, (match, indent, inner) => {
      hasAside = true; 
      indent = indent || '';
      
      let body = unindent(inner).trim();
      let emoji = '';

      if (startsWithEmoji(body)) {
        const len = getFirstEmojiLen(body);
        emoji = body.slice(0, len).trim();
        body = body.slice(len).trim();
      } else {
        const imgMatch = body.match(/^(<img[^>]+>)\s*/i);
        if (imgMatch) {
          emoji = imgMatch[1];
          body = body.slice(imgMatch[0].length).trim();
        }
      }

      const parsedBody = marked.parse(body);
      const pId = `ASIDE_PLACEHOLDER_${asideCounter++}`;
      
      // 添加捕获的缩进，确保生成的 HTML 块同级匹配列表项缩进
      const p = `\n\n${indent}<div id="${pId}"></div>\n\n`;
      const iconHtml = emoji ? `<span class="callout-icon">${emoji}</span>` : '';
      
      asideMap[pId] = `<div class="callout">${iconHtml}<div class="callout-body">${parsedBody}</div></div>`;
      return p;
    });
  }

  let html = marked.parse(processed);

  Object.keys(asideMap).reverse().forEach((pId) => { 
    html = html.replace(new RegExp(`<div id="${pId}"></div>`, 'g'), () => asideMap[pId]); 
  });

  Object.keys(mathMap).forEach((p) => { 
    html = html.replace(new RegExp(p, 'g'), () => mathMap[p]); 
  });

  return html;
}

// 新增此函数：用于在 CodeMirror 中查找标题行号并居中滚动
function jumpToCodeMirrorHeading(targetId) {
  let inCodeBlock = false;
  let cmHeadings = [];
  
  // 1. 快速遍历编辑器源码，提取所有合法的 ATX 标题 (H1-H3)
  for (let i = 0; i < cmEditor.lineCount(); i++) {
    const text = cmEditor.getLine(i);
    // 简单跳过代码块，防止误匹配代码里面的注释 #
    if (text.match(/^```/)) {
      inCodeBlock = !inCodeBlock;
      continue;
    }
    if (!inCodeBlock) {
      const m = text.match(/^(#{1,3})\s+(.*)$/);
      if (m) {
        // 剥离基础 Markdown 格式以尽可能匹配 DOM 的 textContent
        let plainText = m[2].replace(/(\*\*|__|\*|_|`|~~)/g, '')
                            .replace(/\[(.*?)\]\(.*?\)/g, '$1')
                            .replace(/<[^>]+>/g, '') 
                            .trim();
        cmHeadings.push({ line: i, level: m[1].length, text: plainText });
      }
    }
  }

  // 2. 剔除第一个 H1（因为渲染时它变成了 .doc-main-title，并未计入 TOC）
  const firstH1Index = cmHeadings.findIndex(h => h.level === 1);
  if (firstH1Index !== -1) {
    cmHeadings.splice(firstH1Index, 1);
  }

  // 3. 复刻 assignHeadingIds 的 ID 生成与计数逻辑，寻找完美匹配的行号
  const counter = new Map();
  let targetLine = -1;
  for (let i = 0; i < cmHeadings.length; i++) {
    const h = cmHeadings[i];
    const base = slugify(h.text) || `section-${i + 1}`;
    const seen = counter.get(base) || 0;
    counter.set(base, seen + 1);
    const id = seen ? `${base}-${seen + 1}` : base;

    if (id === targetId) {
      targetLine = h.line;
      break;
    }
  }

  // 4. 定位并滚动 CodeMirror
  if (targetLine !== -1) {
    // 设置光标位置
    cmEditor.setCursor({ line: targetLine, ch: 0 });
    // 计算该行在文档中的局部坐标
    const coords = cmEditor.charCoords({ line: targetLine, ch: 0 }, "local");
    // 将该行直接置于编辑区首行展示（减去 10 像素是为了留一点点顶部呼吸感，避免文字完全贴着边框）
    cmEditor.scrollTo(null, coords.top - 10);
  }
}

function buildTOC() {
  const headings = [...docEl.querySelectorAll('h1:not(.doc-main-title), h2, h3')];
  tocList.innerHTML = '';
  if (!headings.length) {
    tocList.innerHTML = '<div style="color:var(--text-2); font-size:13px; line-height:1.6; padding:4px 6px;">暂无标题，可在文档中添加 h1 / h2 / h3 自动生成目录。</div>';
    return;
  }
  headings.forEach((heading) => {
    const btn = document.createElement('button');
    const level = heading.dataset.tocLevel || heading.tagName[1] || '1';
    btn.className = `toc-item level-${level}`;
    btn.textContent = heading.textContent.trim() || '未命名标题';
    btn.dataset.targetId = heading.id;
    // 修改此处：替换 buildTOC() 中原有的 btn.addEventListener 逻辑
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.targetId);
      if (!target) return;

      // 【关键防抖】强制锁住滚动同步，防止预览区和编辑器区互相触发 scroll 事件导致疯狂抖动
      syncLock = true;
      clearTimeout(syncReleaseTimer);

      // 1. 右侧预览区平滑滚动
      const top = target.offsetTop - 18;
      previewScroll.scrollTo({ top, behavior: 'smooth' });
      setActiveToc(target.id);

      // 2. 左/中侧 CodeMirror 源码区滚动定位并高亮光标
      // 如果左侧编辑器被折叠，不执行源码滚动以节省性能
      if (!paneEditor.classList.contains('collapsed')) {
        jumpToCodeMirrorHeading(target.id);
      }

      // 右侧的 behavior: 'smooth' 大约需要几百毫秒，设定 600ms 后再释放同步锁
      syncReleaseTimer = setTimeout(() => { 
        syncLock = false; 
      }, 600);
    });
    tocList.appendChild(btn);
  });
  updateTocActiveByScroll();
}

function setActiveToc(activeId) {
  [...tocList.querySelectorAll('.toc-item')].forEach((item) => {
    item.classList.toggle('active', item.dataset.targetId === activeId);
  });
}

function updateTocActiveByScroll() {
  const headings = [...docEl.querySelectorAll('h1:not(.doc-main-title), h2, h3')];
  if (!headings.length) return;
  let current = headings[0];
  for (let i = headings.length - 1; i >= 0; i--) {
    if (headings[i].offsetTop - previewScroll.scrollTop <= 48) {
      current = headings[i];
      break;
    }
  }
  setActiveToc(current.id);
}

function initImageControls() {
  const images = docEl.querySelectorAll('img');
  images.forEach(img => {
    if (img.parentElement && img.parentElement.classList.contains('img-wrapper')) return;

    const container = document.createElement('div');
    container.className = 'img-container img-container-left'; 
    const wrapper = document.createElement('div');
    wrapper.className = 'img-wrapper';

    img.parentNode.insertBefore(container, img);
    container.appendChild(wrapper);
    wrapper.appendChild(img);

    const toolbar = document.createElement('div');
    toolbar.className = 'img-toolbar';
    toolbar.innerHTML = `
      <button data-align="left" title="左对齐"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="19" y2="18"></line></svg></button>
      <button data-align="center" title="居中对齐"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="5" y1="18" x2="19" y2="18"></line></svg></button>
      <button data-align="right" title="右对齐"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="5" y1="18" x2="21" y2="18"></line></svg></button>
    `;
    wrapper.appendChild(toolbar);

    toolbar.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const align = btn.dataset.align;
        container.className = `img-container img-container-${align}`;
      });
    });

    img.addEventListener('dragstart', (e) => e.preventDefault());

    ['top-left', 'top-right', 'bottom-left', 'bottom-right'].forEach(pos => {
      const handle = document.createElement('div');
      handle.className = `resize-handle ${pos}`;
      wrapper.appendChild(handle);

      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const startX = e.clientX;
        const startWidth = img.getBoundingClientRect().width;
        const isLeft = pos.includes('left');

        wrapper.querySelectorAll('.resize-handle').forEach(h => h.classList.add('active'));

        function onMouseMove(moveEvent) {
          const dx = moveEvent.clientX - startX;
          let newWidth = isLeft ? startWidth - dx : startWidth + dx;
          
          if (container.classList.contains('img-container-center')) {
            newWidth = isLeft ? startWidth - dx * 2 : startWidth + dx * 2;
          }

          if (newWidth > 50) { 
            img.style.width = newWidth + 'px';
          }
        }

        function onMouseUp() {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          wrapper.querySelectorAll('.resize-handle').forEach(h => h.classList.remove('active'));
        }

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    });
  });
}

function render() {
  const src = cmEditor.getValue();
  document.getElementById('charCount').textContent = src.length.toLocaleString() + ' 字符';

  if (!src.trim()) {
    docEl.innerHTML = `<div class="empty">
      <div class="empty-icon">📦</div>
      <div class="empty-text">支持拖拽解析 Notion 导出的 .zip 文件</div>
      <div class="empty-steps">
        <div><b>💡 当前已增强</b></div>
        <div>1. 中间拖拽分隔条，自由调整编辑区 / 预览区比例</div>
        <div>2. 顶部左侧可快速切换目录与源码区，正文保持右侧预览</div>
        <div>3. 纸张尺寸 / 页边距 / 行距 / 字距 / 段距微调</div>
        <div>4. 智能识别文档大标题并解决层级冲突</div>
        <div>5. <span style="color:var(--text)"><b>[NEW]</b></span> 图片悬停即可弹出交互工具，支持<b>自由对齐与等比缩放</b></div>
      </div>
    </div>`;
    buildTOC();
    return;
  }

  docEl.innerHTML = processMarkdown(src);

  const firstH1 = docEl.querySelector('h1');
  if (firstH1) {
    firstH1.classList.add('doc-main-title');
  }

  assignHeadingIds();
  initImageControls();

  renderMathInElement(docEl, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '\\[', right: '\\]', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false}
    ],
    throwOnError: false,
    errorColor: '#c7254e'
  });

  docEl.querySelectorAll('.callout-body pre code').forEach((node) => {
    try { hljs.highlightElement(node); } catch (e) {}
  });

  const h1 = docEl.querySelector('h1');
  if (h1) document.title = h1.textContent + ' — PDF Pro';

  buildTOC();
}

function resetFiles(content = '') {
  cmEditor.setValue(content);
  render();
}

async function handleFile(file) {
  if (file.name.endsWith('.zip')) {
    try {
      const zip = await JSZip.loadAsync(file);
      globalImageMap = {};
      let mdContent = '';
      const fileEntries = Object.entries(zip.files).sort(([a], [b]) => a.localeCompare(b));

      for (const [path, entry] of fileEntries) {
        if (entry.dir) continue;
        if (/\.(png|jpe?g|gif|webp|svg)$/i.test(path)) {
          const blob = await entry.async('blob');
          const url = URL.createObjectURL(blob);
          globalImageMap[path] = url;
          globalImageMap[path.split('/').pop()] = url;
        }
      }

      for (const [path, entry] of fileEntries) {
        if (entry.dir) continue;
        if (/\.md$/i.test(path)) {
          mdContent = await entry.async('string');
          editorTitle.textContent = `MARKDOWN 源码 · ${path.split('/').pop()}`;
          break;
        }
      }

      if (mdContent) resetFiles(mdContent);
      else alert('解析失败：ZIP 包中未找到 .md 文件！');
    } catch (e) {
      console.error(e);
      alert('ZIP 读取失败，请确保文件格式正确。');
    }
  } else if (file.name.endsWith('.md')) {
    globalImageMap = {};
    editorTitle.textContent = `MARKDOWN 源码 · ${file.name}`;
    resetFiles(await file.text());
  } else {
    alert('请上传 Notion 导出的 .zip 或 .md 文件！');
  }
}

function updateFontSize(diff) {
  currentFontSize += diff;
  if (currentFontSize < 12) currentFontSize = 12;
  if (currentFontSize > 26) currentFontSize = 26;
  document.documentElement.style.setProperty('--doc-font-size', currentFontSize + 'px');
  document.getElementById('fontSizeVal').textContent = currentFontSize + 'px';
}

function applyPageStyle() {
  const sizeKey = document.getElementById('paperSizeSelect').value;
  const marginKey = document.getElementById('pageMarginSelect').value;
  const size = pagePresets[sizeKey];
  const margin = marginPresets[marginKey];
  document.documentElement.style.setProperty('--page-width', size.width);
  document.documentElement.style.setProperty('--page-padding-x', margin.screenX);
  document.documentElement.style.setProperty('--page-padding-top', margin.screenTop);
  document.documentElement.style.setProperty('--page-padding-bottom', margin.screenBottom);
  document.getElementById('dynamicPageStyle').textContent = `@page { size: ${size.page}; margin: ${margin.css}; }`;
}

function syncEditorToPreview() {
  if (syncLock) return;
  const info = cmEditor.getScrollInfo();
  const maxEditor = Math.max(1, info.height - info.clientHeight);
  const percent = maxEditor <= 0 ? 0 : info.top / maxEditor;
  const maxPreview = Math.max(1, previewScroll.scrollHeight - previewScroll.clientHeight);
  syncLock = true;
  previewScroll.scrollTop = percent * maxPreview;
  clearTimeout(syncReleaseTimer);
  syncReleaseTimer = setTimeout(() => { syncLock = false; updateTocActiveByScroll(); }, 80);
}

function syncPreviewToEditor() {
  if (syncLock) return;
  const maxPreview = Math.max(1, previewScroll.scrollHeight - previewScroll.clientHeight);
  const percent = maxPreview <= 0 ? 0 : previewScroll.scrollTop / maxPreview;
  const info = cmEditor.getScrollInfo();
  const maxEditor = Math.max(1, info.height - info.clientHeight);
  syncLock = true;
  cmEditor.scrollTo(null, percent * maxEditor);
  clearTimeout(syncReleaseTimer);
  syncReleaseTimer = setTimeout(() => { syncLock = false; }, 80);
}

cmEditor.on('change', () => {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 180);
});
cmEditor.on('scroll', () => {
  if (enableScrollSync) syncEditorToPreview();
});
previewScroll.addEventListener('scroll', () => {
  updateTocActiveByScroll();
  if (enableScrollSync) syncPreviewToEditor();
});

const resizer = document.getElementById('resizer');
let resizing = false;
resizer.addEventListener('mousedown', () => {
  if (paneEditor.classList.contains('collapsed')) return;
  resizing = true;
  resizer.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', (e) => {
  if (!resizing) return;
  const mainRect = document.querySelector('.main').getBoundingClientRect();
  const min = 320;
  const max = Math.max(min, mainRect.width - 360);
  let nextWidth = e.clientX - mainRect.left;
  nextWidth = Math.max(min, Math.min(max, nextWidth));
  const percent = (nextWidth / mainRect.width) * 100;
  document.documentElement.style.setProperty('--editor-width', percent + '%');
});
document.addEventListener('mouseup', () => {
  resizing = false;
  resizer.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

document.getElementById('calloutStyleSelect').addEventListener('change', (e) => {
  if (e.target.value === 'outline') docEl.classList.add('callout-outline-mode');
  else docEl.classList.remove('callout-outline-mode');
});
document.getElementById('colorPicker').addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--callout', e.target.value);
});
document.getElementById('btnToggleSidebar').addEventListener('click', (e) => {
  paneEditor.classList.toggle('collapsed');
  resizer.classList.toggle('hidden', paneEditor.classList.contains('collapsed'));
  e.currentTarget.classList.toggle('active', !paneEditor.classList.contains('collapsed'));
  setTimeout(() => { cmEditor.refresh(); updateTocActiveByScroll(); }, 220);
});
document.getElementById('btnToggleToc').addEventListener('click', (e) => {
  tocSidebar.classList.toggle('hidden');
  e.currentTarget.classList.toggle('active', !tocSidebar.classList.contains('hidden'));
  setTimeout(() => updateTocActiveByScroll(), 120);
});
document.getElementById('btnFontMinus').addEventListener('click', () => updateFontSize(-1));
document.getElementById('btnFontPlus').addEventListener('click', () => updateFontSize(1));
document.getElementById('fontSelect').addEventListener('change', (e) => {
  document.documentElement.style.setProperty('--doc-font-family', e.target.value);
});
function updateLineHeight(diff) {
  currentLineHeight = Math.max(1.2, Math.min(2.4, +(currentLineHeight + diff).toFixed(1)));
  document.documentElement.style.setProperty('--doc-line-height', currentLineHeight);
  document.getElementById('lineHeightVal').textContent = currentLineHeight.toFixed(1) + 'x';
}
function updateLetterSpacing(diff) {
  currentLetterSpacing = Math.max(-0.02, Math.min(0.12, +(currentLetterSpacing + diff).toFixed(2)));
  document.documentElement.style.setProperty('--doc-letter-spacing', currentLetterSpacing.toFixed(2) + 'em');
  document.getElementById('letterSpacingVal').textContent = currentLetterSpacing.toFixed(2) + 'em';
}
function updateParagraphGap(diff) {
  currentParagraphGap = Math.max(0.2, Math.min(2.0, +(currentParagraphGap + diff).toFixed(1)));
  document.documentElement.style.setProperty('--doc-paragraph-gap', currentParagraphGap.toFixed(1) + 'em');
  document.getElementById('paragraphGapVal').textContent = currentParagraphGap.toFixed(1) + 'em';
}
const moreMenu = document.getElementById('moreMenu');
document.getElementById('btnMoreMenu').addEventListener('click', (e) => {
  e.stopPropagation();
  moreMenu.classList.toggle('hidden');
});
moreMenu.addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('click', () => moreMenu.classList.add('hidden'));
document.getElementById('btnLineHeightMinus').addEventListener('click', () => updateLineHeight(-0.1));
document.getElementById('btnLineHeightPlus').addEventListener('click', () => updateLineHeight(0.1));
document.getElementById('btnLetterSpacingMinus').addEventListener('click', () => updateLetterSpacing(-0.01));
document.getElementById('btnLetterSpacingPlus').addEventListener('click', () => updateLetterSpacing(0.01));
document.getElementById('btnParagraphGapMinus').addEventListener('click', () => updateParagraphGap(-0.1));
document.getElementById('btnParagraphGapPlus').addEventListener('click', () => updateParagraphGap(0.1));
document.getElementById('paperSizeSelect').addEventListener('change', applyPageStyle);
document.getElementById('pageMarginSelect').addEventListener('change', applyPageStyle);

document.getElementById('btnPrint').addEventListener('click', () => {
  if (!cmEditor.getValue().trim()) return alert('请先载入内容');
  window.print();
});
document.getElementById('btnClear').addEventListener('click', () => {
  const hasContent = cmEditor.getValue().trim();
  if (hasContent && !window.confirm('确认清空当前内容吗？此操作不可撤销。')) return;
  globalImageMap = {};
  editorTitle.textContent = 'MARKDOWN 源码';
  resetFiles('');
});

paneEditor.addEventListener('dragover', (e) => {
  e.preventDefault();
  paneEditor.classList.add('drag-over');
});
paneEditor.addEventListener('dragleave', () => paneEditor.classList.remove('drag-over'));
paneEditor.addEventListener('drop', (e) => {
  e.preventDefault();
  paneEditor.classList.remove('drag-over');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  if (e.target.files.length > 0) {
    handleFile(e.target.files[0]);
    e.target.value = '';
  }
});

updateLineHeight(0);
updateLetterSpacing(0);
updateParagraphGap(0);
applyPageStyle();
resetFiles('');
setTimeout(() => cmEditor.refresh(), 60);
</script>
</body>
</html>
